[project]
name = "taller"
version = "0.1.0"
description = "Mesa de taller personal para analizar y optimizar mazos de Commander"
readme = "README.md"
authors = [
    { name = "Martin Rodriguez", email = "38300756+EduardoM104@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
taller = "taller:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
