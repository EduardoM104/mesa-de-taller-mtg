# Plantilla de configuración. Cópiala como config.toml (que no se versiona)
# y ajusta las rutas a tu Mac.

[coleccion]
# Carpeta donde ManaBox deja sus exportaciones CSV. El taller solo la lee:
# nunca escribe, mueve ni borra nada ahí.
carpeta_manabox = "~/Documents/MTG Archive"

[precios]
# Pesos por dólar para convertir los precios de referencia (USD) a MXN.
tipo_de_cambio = 18

[tiendas]
# Perfil público (UCP) con el que nos identificamos ante Yellow Rabbit: un JSON
# servido como application/json. Sin esto, la lista de compra solo trae ligas.
# perfil_ucp = "https://gist.githack.com/<usuario>/<gist>/raw/<versión>/mesa-de-taller-ucp.json"

[envios]
# Costo de envío por tienda (MXN) y monto a partir del cual es gratis (0 = nunca gratis).
yellow_rabbit = { costo = 0, gratis_desde = 0, nota = "recoger en sucursal" }
tcg_wolf = { costo = 150, gratis_desde = 2200, nota = "costo promedio" }
